# Opt-in layer: mount the dsh-chinese function plugin over the current
# composition without changing shipped defaults.
#
#   dsh plugin --profile web add github:falling-ts/dsh-chinese   # install
#   dsh web --patch dsh-chinese/cordis.patch.yml                 # dev overlay
#
# The Host half registers three sections on the system-prompt registry — the
# documented extension point first-party tool packages use — so every model
# request carries three standing rules. Each rule opens with a BOLDED one-line
# digest (`**…**`) of its core requirement, followed by the detail lines that
# remain the actual contract:
#
#   1. all thinking and temporary output in Chinese, code and symbols verbatim;
#   2. every file edit through the editing tools, with commands and scripts
#      allowed only to VERIFY an edit;
#   3. a verification script run inline (here-document or -e) rather than
#      written to a temporary file first, so no scratch file is left behind.
#
# It also substitutes the deployment's own product name: every `DeepSeek
# Harness` the harness writes into the assembled system prompt reaches the
# model as `Work Buddy`. That half rides the registry's own
# `system-prompt/assemble` waterfall, because `section()` can only append text
# while the identity sentence belongs to a section the registry registers
# itself.
#
# The `**…**` reaches the model as written: upstream's `renderPrompt` only
# interpolates `{{…}}` and drops empty sections, so the markers are not markup
# to be stripped — first-party system prompts use the same emphasis.
#
# All four switches default to on and are toggled through the entry's own Config
# (chineseOnly / editToolOnly / inlineScriptOnly / rebrand). There is no client
# half: the rules change what the model reads, not what the UI shows.

- insert:
    - id: falling-ts-chinese
      name: '@falling-ts/dsh-chinese'
